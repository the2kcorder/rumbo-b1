 {id:"mundo",title:"¿Será el mundo un lugar mejor?",topic:"Ciudades del futuro",src:"nach Aula 3, Unidad 3",

 {id:"glob",title:"Una camiseta que da la vuelta al mundo",topic:"Globalización",src:"eigener Übungstext",
  text:"¿Sabes de dónde viene tu camiseta? Muchas veces, el algodón se cultiva en un país, la tela se produce en otro y la camiseta se cose en un tercero, por ejemplo en Bangladés. Después, viaja miles de kilómetros hasta una tienda en Europa. Esto es la globalización: los países están cada vez más conectados por el comercio, la tecnología y la cultura.\n\nLa globalización tiene ventajas: los productos son más baratos, las empresas pueden vender en todo el mundo y es más fácil viajar y conocer otras culturas. Pero también tiene desventajas: en algunos países los trabajadores reciben sueldos muy bajos, el transporte contamina mucho y las tiendas pequeñas no pueden competir con las grandes multinacionales. Además, en muchas ciudades del mundo vemos las mismas tiendas y los mismos restaurantes, y las culturas locales pierden importancia.",

 {id:"carta",title:"Carta abierta al alcalde",topic:"Gesellschaft",src:"nach Aula 3, Unidad 6",
  text:"Apreciado señor alcalde:\n\nLos abajo firmantes, representantes de asociaciones de vecinos y de comerciantes de Monreal, nos dirigimos a usted por un tema muy importante para el futuro del pueblo: el instituto Camilo José Cela. El instituto tiene más de 50 años de historia y es el único centro de la comarca donde se puede estudiar bachillerato. Ahora la Consejería de Educación quiere cerrarlo por razones económicas.\n\nSi se cierra, nuestros jóvenes tendrán que viajar cada día en autobús a la capital: 90 minutos de ida y 90 minutos de vuelta. Muchos de ellos abandonarán los estudios. Además, el cierre será dramático para el pueblo: ¿quién querrá vivir en Monreal sin instituto? Por eso, le pedimos que luche por la continuidad del centro. Este problema no es solo responsabilidad del ayuntamiento: todos los ciudadanos deberíamos luchar juntos.\n\nQuedamos a la espera de una pronta respuesta.",

 {id:"redes",title:"Los jóvenes y las redes sociales",topic:"Digitalización",src:"eigener Übungstext",
  text:"Las redes sociales forman parte de la vida diaria de los jóvenes. Muchos pasan varias horas al día en Instagram, TikTok o YouTube. Las redes tienen ventajas: permiten estar en contacto con amigos que viven lejos, informarse rápidamente y aprender cosas nuevas. Muchas empresas también buscan trabajadores a través de las redes.\n\nPero también tienen desventajas. Algunos jóvenes se comparan constantemente con otras personas y se sienten mal. Otros tienen problemas para dormir o para concentrarse en los estudios. Además, en internet circulan muchas noticias falsas y no es fácil proteger la privacidad. Por eso, algunos colegios han prohibido el móvil en clase. Los expertos recomiendan usar las redes de forma consciente: por ejemplo, desactivar las notificaciones o no usar el móvil antes de dormir.",

  text:"Cada año, millones de turistas visitan Mallorca. El turismo es muy importante para la isla: crea muchos puestos de trabajo en hoteles, restaurantes y agencias de viajes. Sin embargo, el turismo de masas también tiene desventajas. En verano, las playas y el centro de Palma están llenos de gente y hay mucho tráfico. Muchos propietarios alquilan sus pisos a turistas; por eso, los alquileres son cada vez más caros y para los vecinos es difícil encontrar vivienda. Además, los turistas consumen mucha agua y producen mucha basura.\n\nEn los últimos años, muchos vecinos han protestado. Algunos expertos proponen un turismo más sostenible: menos turistas que se queden más tiempo, una ecotasa más alta y más visitas fuera de la temporada alta. Otros piensan que no es justo limitar el turismo, porque la isla vive de él.",

 {id:"km0",title:"Buena, limpia y justa: Km 0",topic:"Medioambiente",src:"nach Aula 3, Unidad 11",
  text:"¿Es lógico comprar en un supermercado español legumbres de Estados Unidos? ¿Es sostenible beber en Singapur agua embotellada en los Alpes? Para el movimiento slow food, la respuesta es no. Carlo Petrini creó este movimiento en Italia en 1986 para defender la cocina local. Según slow food, la comida debe ser buena, limpia y justa: debe tener buen gusto, no debe dañar el medioambiente ni la salud, y los productores deben recibir un pago justo.\n\nPor eso, el movimiento apoya a los productores locales. Así, las materias primas no viajan miles de kilómetros y sobreviven variedades autóctonas de vegetales y animales. Hoy existe una red de restaurantes Km 0. Para recibir este sello, el ingrediente principal y el 40 % de los ingredientes de un plato tienen que ser locales, producidos a menos de 100 kilómetros del restaurante.",

 {id:"migr",title:"Trabajar en otro país",topic:"Migración",src:"eigener Übungstext",
  text:"Hoy en día, millones de personas viven en un país diferente al suyo. Las causas de la migración son muy variadas. Muchas personas emigran porque en su país hay paro o los sueldos son muy bajos. Otras huyen de guerras o de la violencia y llegan como refugiados. También hay personas que emigran por amor o porque quieren conocer otra cultura.\n\nAlemania es uno de los países de Europa con más inmigrantes. En muchos sectores, como la salud, la construcción o el turismo, faltan trabajadores, y los inmigrantes son muy necesarios. Sin embargo, la integración no siempre es fácil: aprender el idioma lleva tiempo, los títulos del extranjero a veces no se reconocen y algunas personas sufren discriminación. Por eso, muchos expertos dicen que es importante que haya más cursos de idiomas y que los trámites sean más rápidos.",

function normKey(go){
  const [a,b,c]=String(go).split(":");
  if(a==="cloze"&&(b==="foto"||b==="rolle")) return b;
  if(a==="lesen"||a==="hoeren"||a==="mono"||a==="fragen") return a;
  if(a==="essay") return c==="timed"?"essay:timed":"essay:"+b;
  if(a==="formen"||a==="cloze") return a+":"+b;
  return go;
}
const NO_BACKLOG=new Set(["karten","fehler"]);

function completed(key){

  const t=T.find(t=>normKey(t.go)===key&&!d.done.includes(t.id)&&!t.id.startsWith("nach_"))||T.find(t=>t.id==="nach_"+key&&!d.done.includes(t.id));
  if(t) markDone(t.id);
  if(!t||t.id.startsWith("nach_")){state.extraDone=state.extraDone||{};state.extraDone[key]=(state.extraDone[key]||0)+1;touch("prog")}
}
let blCache=null, blStamp="";
function backlog(){
  const tk=todayKey(), stamp=tk+"|"+(store.prog.updatedAt||0);
  if(blCache&&blStamp===stamp) return blCache;
  const miss={}, labels={};
  for(let n=dayNum(startDay());n<dayNum(tk);n++){
    const k=keyFromNum(n), done=((state.days[k]||{}).done)||[];
    tasksFor(k).forEach(t=>{const key=normKey(t.go);if(NO_BACKLOG.has(key)||done.includes(t.id))return;miss[key]=(miss[key]||0)+1;labels[key]=labels[key]||t})
  }
  const out=[];
  Object.keys(miss).forEach(key=>{const left=miss[key]-((state.extraDone||{})[key]||0);if(left>0){const t=labels[key];out.push({key,count:left,label:t.label.replace(/^Lesen: .*/,"Lesetext").replace(/^Hören: .*/,"Hörtext").replace(/^Monolog: .*/,"Monolog"),min:t.min,go:key==="lesen"?"lesen:":key==="hoeren"?"hoeren:":key==="mono"?t.go:t.go})}});
  blCache=out; blStamp=stamp; return out;
}
function wordBacklog(){
  if(!cardsReady) return 0;
  const d=today();
  if(d.coreStart==null){d.coreStart=cardStats().coreL;touch("prog",true)}
  const days=Math.max(0,dayNum(todayKey())-dayNum(startDay()));
  const total=CARDS.filter(c=>c.deck!=="g").length;
  const expected=Math.min(total,days*state.settings.newPerDay);
  return Math.max(0,expected-d.coreStart);
}
const wordCatchUp=()=>Math.min(10,wordBacklog());

  }else{
    formT("mix");
    add("fragen","Fragen zur Meinung",5,"fragen","fragen","4 Fragen laut beantwortet");
    const rot=dayNum(k)%3;
    clozeT(w.cloze[rot===0?0:1],1);
    if(w.n===5&&(wd===1||wd===4||wd===6)){const t=ESSAY_ORDER[dayNum(k)%5];add("essay","Aufsatz unter Zeitdruck: "+TOPICS[t].name,25,"essay:"+t+":timed","essay","in 25 Min, ohne Spickzettel")}
    else if(wd===6||(w.n===6&&wd===1)) add("essay","Aufsatz: "+TOPICS[w.essay].name,30,"essay:"+w.essay,"essay",`ca. ${TOPICS[w.essay].words} Wörter, Pflichtteile erfüllt`);
    else if(wd===3||wd===0) lesenT();
    else if(wd===2||wd===5) add("hoeren","Hören: "+nextHoerenFor(k).title,6,"hoeren:"+nextHoerenFor(k).id,"hoeren","alle Aussagen richtig");

  return T;
}

/* ---------- sync (db) ---------- */
let db=null, uid=null, refs=null; const dirty={prog:false,srs:false}; let timer=null, writing=false, slowTimer=null;
function setSync(kind,text){if(!kind&&/Gerät/.test(text))kind="on";$("#syncDot").className="dot"+(kind?" "+kind:"");$("#sync").classList.toggle("ok",kind==="on");if(kind==="busy")return;const t=kind==="on"?"✓ gespeichert":/^(Nicht|Sync|Server)/.test(text)?"offline · speichert später":text;const el=$("#syncText");if(el.textContent!==t)el.textContent=t;el.parentElement.title=text}
function touch(part,slow){
  store[part].updatedAt=Date.now(); dirty[part]=true; saveLocal();
  if(!db) return;
  if(slow){ if(!slowTimer) slowTimer=setTimeout(()=>{slowTimer=null;flush()},60000); return }
  clearTimeout(timer); timer=setTimeout(flush,1500);
}
async function flush(){
  if(!db||!refs||writing) return;
  writing=true; setSync("busy","Speichert …");
  try{
    for(const part of ["prog","srs"]){
      if(!dirty[part]) continue;
      dirty[part]=false;
      try{await refs[part].set(JSON.parse(JSON.stringify(store[part])))}catch(e){dirty[part]=true;throw e}
    }
    setSync("on","Gespeichert · alle Geräte");
  }catch(e){
    setSync("","Nicht gespeichert: "+(e&&e.code==="quota_exceeded"?"Speicher voll":"keine Verbindung")+". Nächster Versuch gleich.");
    setTimeout(flush,8000);
  }finally{writing=false; if(dirty.prog||dirty.srs){clearTimeout(timer);timer=setTimeout(flush,1500)}}
}
async function initSync(){
  if(!window.claude||!window.claude.use){setSync("","Gespeichert auf diesem Gerät");return}
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u){setSync("","Gespeichert auf diesem Gerät");return}
    uid=await u.id(); if(!uid){setSync("","Gespeichert auf diesem Gerät");return}
    db=d; refs={prog:db.doc("data/users/"+uid+"/progress"),srs:db.doc("data/users/"+uid+"/cards")};
    let pending=2; const lt=setTimeout(()=>{if(pending>0) setSync("","Server noch nicht erreichbar, lernst lokal weiter")},10000);
    for(const part of ["prog","srs"]){
      let first=true;
      refs[part].onSnapshot(snap=>{
        if(first&&!snap.metadata.fromCache){first=false;pending--; if(pending===0){clearTimeout(lt);setSync("on","Gespeichert · alle Geräte")}}
        if(!snap.exists){ if(!snap.metadata.fromCache&&store[part].updatedAt>0){dirty[part]=true;clearTimeout(timer);timer=setTimeout(flush,500)} return }
        if(snap.metadata.hasPendingWrites) return;
        const remote=snap.data();
        if((remote.updatedAt||0)>(store[part].updatedAt||0)&&!dirty[part]){
          const copy=JSON.parse(JSON.stringify(remote));
          if(part==="prog"){store.prog=merge(fresh(),{prog:copy,srs:store.srs}).prog;state=store.prog}else{store.srs=copy;if(!store.srs.c)store.srs.c={}}
          saveLocal(); if(!busyView()) render();
        }else if((remote.updatedAt||0)<(store[part].updatedAt||0)&&!dirty[part]){dirty[part]=true;clearTimeout(timer);timer=setTimeout(flush,800)}
      },e=>{pending=0;clearTimeout(lt);setSync("","Sync unterbrochen, lernst lokal weiter")});
    }
  }catch(e){setSync("","Gespeichert auf diesem Gerät")}
}

    const p=CARDS.filter(c=>ps.includes(c.pack)&&c.deck==="p"), v=CARDS.filter(c=>ps.includes(c.pack)&&(c.deck==="v"||c.deck==="l"));

function newLeft(){const k=todayKey();return Math.max(0,state.settings.newPerDay+wordCatchUp()-(state.newCount[k]||0))}

  const add=w=>{if(w&&!bad.has(low(w))&&!out.some(o=>low(o)===low(w))&&out.length<3)out.push(w)};

function lookup(raw){
  const w=raw.toLowerCase().replace(/[^a-záéíóúüñ]/g,"");
  if(!w||!DICT) return null;
  const tries=[w,w.replace(/es$/,""),w.replace(/s$/,"")];
  for(const t of tries){ if(DICT[t]) return DICT[t]; const k=DICT_NA[noAcc(t)]; if(k) return DICT[k]; }
  const cache=(state.wordCache||{})[w]; if(cache) return cache;
  return null;
}

  if(w==="rolle") return `<div class="card sheet stack"><h2>Meinung und Rollenspiel</h2>

  <h3>Mit Subjuntivo</h3><ul><li>No creo que / No pienso que + Subjuntivo</li><li>Me molesta que / No me gusta que + Subjuntivo</li><li>Me parece mal / bien que + Subjuntivo</li><li>Beispiel: No creo que las cuotas sean la solución adecuada.</li></ul>
  <h3>Zustimmen und widersprechen</h3><ul><li>(No) estoy de acuerdo contigo / con eso, porque …</li><li>Sí, es verdad, pero, por otro lado, …</li><li>De acuerdo, sin embargo, …</li><li>Yo no lo veo así, ya que en primer lugar, …</li><li>Otro argumento a favor de / en contra de … es …</li><li>Por un lado, … pero por otro lado, …</li><li>¿Qué te parece …?</li></ul></div>`;

  <h3>Condicional</h3><p>Infinitiv + ía, ías, ía, íamos, íais, ían: viajaría. Gleiche Stämme wie Futuro: tendría, haría, podría, habría. Für Wünsche und Vorschläge: me gustaría, debería, sería mejor …</p>
  <h3>Subjuntivo presente</h3><p>yo-Form Präsens, -o weg, Vokal tauschen: -ar → -e (hable), -er/-ir → -a (coma, viva). tengo → tenga, hago → haga, digo → diga, salgo → salga.</p><p>Unregelmäßig: sea, esté, vaya, haya, sepa, dé. pueda / podamos, quiera / queramos.</p>

const wordCount=s=>(s.trim().match(/\S+/g)||[]).length;
function essayChecks(text){
  const low=" "+text.toLowerCase()+" ";
  const con=CONNECTORS.filter(c=>low.includes(c));
  const fut=(low.match(/[a-záéíóúñ]+(?:ré|rás|rá|remos|réis|rán)(?![a-záéíóúñ])/g)||[]).length;
  const cond=(low.match(/[a-záéíóúñ]+rí(?:a|as|amos|ais|an)(?![a-záéíóúñ])/g)||[]).length;
  const subj=SUBJ_TRIGGERS.filter(t=>low.includes(t)).length;
  return {con,fut,cond,subj,wc:wordCount(text)};
}

/* ---------- swipe on cards ---------- */
function bindSwipe(){
  const el=document.getElementById("flash"); if(!el||!sub||sub.kind!=="cards") return;
  let x0=null,y0=0,dx=0,moved=false;
  el.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;x0=e.clientX;y0=e.clientY;dx=0;moved=false;el.setPointerCapture(e.pointerId);el.style.transition="none"});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8)moved=true;if(!sub.shown)return;el.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;const w=el.parentElement;w.classList.toggle("go-r",dx>60);w.classList.toggle("go-l",dx<-60)});
  const end=e=>{if(x0===null)return;const d=dx;x0=null;el.style.transition="";
    if(!moved){if(!sub.shown)reveal();return}
    if(sub.shown&&Math.abs(d)>90){el.style.transform=`translateX(${d>0?600:-600}px) rotate(${d>0?20:-20}deg)`;setTimeout(()=>doKnown(d>0),140)}
    else{el.style.transform="";const w=el.parentElement;w.classList.remove("go-r","go-l");if(!sub.shown)reveal()}};
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",()=>{x0=null;el.style.transform=""});
}
function undoCard(){
  const s=sub, h=s.hist.pop(); if(!h) return;
  if(h.c) store.srs.c[h.id]=h.c; else delete store.srs.c[h.id];
  s.queue=h.queue; s.done=h.done; s.fails=h.fails;
  if(h.failed) s.failed.add(h.id); else s.failed.delete(h.id);
  const k=todayKey(); if(h.nc==null) delete state.newCount[k]; else state.newCount[k]=h.nc;
  today().cards=h.cards; s.active=true;
  const d=today(); const i=d.done.indexOf("karten"); if(i>=0&&!cardsGoalMet()) d.done.splice(i,1);
  s.shown=true; touch("srs"); touch("prog"); render();
}

function doKnown(k){
  const s=sub, id=s.queue[0]; if(!id) return;

  s.hist.push({queue:s.queue.slice(),c:c?c.slice():null,id,done:s.done,fails:s.fails,failed:s.failed.has(id),nc:state.newCount[todayKey()],cards:today().cards});

document.addEventListener("click",ev=>{
  const wsp=ev.target.closest(".w"); if(wsp){const ctxEl=wsp.closest("p");showWord(wsp.dataset.w,ctxEl?ctxEl.textContent:"");return}
  const pop=document.getElementById("wordPop"); if(pop&&!pop.hidden&&!ev.target.closest("#wordPop")) pop.hidden=true;
  const b=ev.target.closest("button,[data-tab]"); if(!b) return;
  const d=b.dataset;
  if(d.tab){if(speakState!=="idle")stopSpeak();sub=null;view=d.tab;if(view==="karten")startCards(false);try{history.replaceState(null,"","#"+view)}catch(e){}render();window.scrollTo(0,0);return}
  if(d.go!=null){go(d.go);return}
  if(d.back!=null){if(speakState!=="idle")stopSpeak();sub=null;render();return}
  if(d.speak!=null){speak(d.speak);return}
  if(d.ch){const i=document.getElementById("ansIn")||document.getElementById("typeIn");if(i&&!i.disabled){const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+d.ch+i.value.slice(i.selectionEnd??p);i.focus();i.setSelectionRange(p+1,p+1);if(sub)sub.typed=i.value}return}
  if(d.reveal!=null){reveal();return}
  if(d.known!=null){doKnown(d.known==="1");return}
  if(d.tileinfo){const w=d.tileinfo.replace(/[¡!¿?.,;:"]/g,"");if(/^(el|la)\/(el|la)$/.test(w)){showWord(w,"","der / die (je nach Geschlecht)",true);return}showOpt(w.replace(/\/(a|ona|ora)$/,""));return}
  if(d.undo!=null){undoCard();return}
  if(d.flag){if((state.wrong||{})[d.flag])unmarkCard(d.flag);else markCard(d.flag);render();return}
  if(d.flagq!=null){const idx=sub.queue[0],it=sub.items[idx];sub.flagged=sub.flagged||new Set();if(sub.flagged.has(idx)){sub.flagged.delete(idx);const gid=gapCardId(it);if(gid)unmarkCard(gid)}else{sub.flagged.add(idx);errWrong(it.key);const gid=gapCardId(it);if(gid)markCard(gid);touch("prog")}render();return}
  if(d.wordsave){const w=d.wordsave;const tr=lastPopTr||lookup(w)||(state.wordCache||{})[w.toLowerCase()]||"";saveWord(w,tr);b.textContent="★ gemerkt";b.disabled=true;return}
  if(d.mc!=null){if(sub.ex&&sub.ex.res){showOpt(sub.ex.opts[Number(d.mc)]);return}exCheck(Number(d.mc));return}
  if(d.tile!=null){const ex=sub.ex;const i=Number(d.tile);if(!ex.tiles[i].used){ex.tiles[i].used=true;ex.picked.push(i)}render();return}
  if(d.untile!=null){const ex=sub.ex;const k=Number(d.untile);const i=ex.picked.splice(k,1)[0];ex.tiles[i].used=false;render();return}
  if(d.excheck!=null){exCheck();return}
  if(d.exnext!=null){exNext(d.exnext==="1");return}
  if(d.exch){const i=document.getElementById("exIn");if(i&&!i.disabled){const p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+d.exch+i.value.slice(i.selectionEnd??p);i.focus();i.setSelectionRange(p+1,p+1);sub.ex.typed=i.value}return}
  if(d.reset){doReset(d.reset);return}
  if(d.qcheck!=null){quizCheck();return}
  if(d.qdunno!=null){quizCheck(undefined,false,true);return}
  if(d.exdunno!=null){const ex=sub.ex;if(ex&&!ex.res){ex.res="bad";ex.typed="";hit(false);render()}return}
  if(d.choice!=null){const it=sub.items[sub.queue[0]];if(sub.res){showOpt(it.choices[Number(d.choice)]);return}sub.typed=it.choices[Number(d.choice)];quizCheck(undefined,true);return}
  if(d.showtr!=null){sub.showTr=true;render();return}
  if(d.pick!=null){if(sub.res){const it=sub.items[sub.queue[0]];showOpt(it.mc[Number(d.pick)]);return}quizCheck(Number(d.pick));return}
  if(d.qnext!=null){quizNext();return}
  if(d.play!=null){const t=HOEREN.find(x=>x.id===sub.id);sub.plays=(sub.plays||0)+1;speakEs(t.text);render();return}
  if(d.pausesp!=null){pauseSpeak();return}
  if(d.stopsp!=null){stopSpeak();return}
  if(d.rate){const r=Number(d.rate);state.settings.rate=r;touch("prog");if(speakState!=="idle"&&sub&&sub.kind==="hoeren"){const t=HOEREN.find(x=>x.id===sub.id);speakEs(t.text)}render();return}
  if(d.hrf){const [i,v]=d.hrf.split(":");const t=HOEREN.find(x=>x.id===sub.id);const x=hz(t.id);x.rf[i]=v==="1";const ok=x.rf[i]===t.rf[i][1];hit(ok);if(!ok)errWrong("h|"+t.id+"|"+i);hoerenUpdate();render();return}
  if(d.showtext!=null){sub.showText=true;render();return}
  if(d.hreset!=null){const x=hz(sub.id);x.rf={};sub.showText=false;sub.plays=0;touch("prog");render();return}
  if(d.say!=null){speakEs(d.say);return}
  if(d.frageshow!=null){sub.shown=true;render();return}
  if(d.frage!=null){rateFrage(d.frage==="1");return}
  if(d.spoke){
    if(d.spoke==="foto"){state.fotoN=(state.fotoN||0)+1;completed("foto")}
    if(d.spoke==="rolle"){state.rolleN=(state.rolleN||0)+1;completed("rolle")}
    if(d.spoke==="mono"){const x=mono(sub.topic);x.count=(x.count||0)+1;completed("mono")}
    touch("prog"); sub.spoke=true; render(); return;
  }
  if(d.tpl!=null){const ta=$("#essayText");const cur=ta.value.trim();ta.value=cur?cur+"\n\n"+template(sub.topic):template(sub.topic);saveEssay(ta.value);render();return}
  if(d.copy!=null){const ta=$("#essayText");const txt=ta.value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{b.textContent="Kopiert"}).catch(()=>{ta.select();b.textContent="Markiert: jetzt kopieren"})}else{ta.select();b.textContent="Markiert: jetzt kopieren"}return}
  if(d.correct!=null){correctEssay();return}
  if(d.copyfix){if(d.copyfix==="essay")correctEssay();else if(d.copyfix==="mono")checkMono();else checkLesen();return}
  if(d.backup!=null){doBackup();return}
  if(d.restore!=null){if(pendingRestore){applyRestore()}return}
  if(d.speakmono!=null){speak($("#monoText").value.slice(0,2000));return}
  if(d.monocheck!=null){checkMono();return}
  if(d.partner!=null){state.partner++;touch("prog");render();return}
  if(d.rf){const [i,v]=d.rf.split(":");const t=LESEN.find(x=>x.id===sub.id);const x=lz(sub.id);x.rf[i]=v==="1";hit(x.rf[i]===t.rf[i][1]);if(x.rf[i]!==t.rf[i][1])errWrong("l|"+t.id+"|"+i);lesenUpdate();render();return}
  if(d.model!=null){sub.model[d.model]=true;render();return}
  if(d.lesencheck!=null){checkLesen();return}
  if(d.lesenreset!=null){const x=lz(sub.id);x.rf={};x.ans={};x.feedback="";sub.model={};touch("prog");render();return}
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="typeIn"||t.id==="ansIn"){if(sub)sub.typed=t.value}
  if(t.id==="exIn"&&sub&&sub.ex){sub.ex.typed=t.value}
  if(t.id==="exCopy"&&sub&&sub.ex){const ex=sub.ex;ex.copy=t.value;ex.copyOk=judge(t.value,variants(ex.answer))!=="bad";t.classList.toggle("copyok",ex.copyOk);const nb=document.querySelector('[data-exnext="0"]');if(nb)nb.disabled=!ex.copyOk}
  if(t.id==="qCopy"&&sub&&sub.kind==="quiz"){const it=sub.items[sub.queue[0]];sub.copy=t.value;sub.copyOk=judge(t.value,it.answers)!=="bad";t.classList.toggle("copyok",sub.copyOk);const nb=document.querySelector("[data-qnext]");if(nb)nb.disabled=!sub.copyOk}
  if(t.id==="essayText"){saveEssay(t.value)}
  if(t.id==="fbIn"){const x=fbTarget();if(x){x.feedback=t.value;clearTimeout(essayT);essayT=setTimeout(()=>touch("prog"),800)}}
  if(t.id==="monoText"){mono(sub.topic).text=t.value;clearTimeout(essayT);essayT=setTimeout(()=>touch("prog"),800)}
  if(t.id.startsWith("op_")&&sub&&sub.kind==="lesen"){lz(sub.id).ans[t.id.slice(3)]=t.value;clearTimeout(essayT);essayT=setTimeout(()=>{lesenUpdate();const st=document.getElementById("lesenStatus");if(st&&lesenComplete(LESEN.find(x=>x.id===sub.id),lz(sub.id)))render()},900)}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="newPerDay"){state.settings.newPerDay=Math.max(0,Math.min(40,Number(t.value)||0));touch("prog");startCards(false);render()}
  if(t.id==="typing"){state.settings.typing=t.checked;touch("prog");render()}
  if(t.id==="rest"){state.settings.rest=t.checked;touch("prog");startCards(false);render()}
  if(t.id==="examDate"){state.settings.exam=t.value;touch("prog")}
  if(t.id==="restoreFile"&&t.files&&t.files[0]){const f=t.files[0];const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o&&o.app==="rumbo-b1"&&o.store&&o.store.prog){pendingRestore=o;restoreMsg="Sicherung vom "+(o.savedAt||"").slice(0,10)+" geladen. Tippe auf „Wiederherstellen“."}else{pendingRestore=null;restoreMsg="Das ist keine Rumbo-Sicherung."}}catch(e){pendingRestore=null;restoreMsg="Die Datei ließ sich nicht lesen."}render()};r.readAsText(f)}
  if(t.id==="sound"){state.settings.sound=t.checked;touch("prog")}
});
document.addEventListener("keydown",ev=>{
  if(!sub) return;
  if(sub.kind==="cards"&&!sub.extra&&sub.queue[0]&&sub.ex){
    const ex=sub.ex;
    if(ev.key==="Enter"){ev.preventDefault();if(ex.res)exNext(false);else if(ex.t!=="mc")exCheck();return}
    if(ex.t==="mc"&&!ex.res&&["1","2","3","4"].includes(ev.key)){ev.preventDefault();exCheck(Number(ev.key)-1);return}
    return;
  }
  if(sub.kind==="cards"&&sub.queue[0]){
    if(!sub.shown&&(ev.key==="Enter"||(ev.key===" "&&ev.target.id!=="typeIn"))){ev.preventDefault();reveal();return}
    if(sub.shown&&(ev.key==="ArrowRight"||ev.key==="ArrowLeft")){ev.preventDefault();doKnown(ev.key==="ArrowRight");return}
  }
  if(sub.kind==="cards"&&(ev.key==="Backspace"&&ev.target.tagName!=="INPUT")){ev.preventDefault();undoCard();return}
  if(sub.kind==="quiz"&&!sub.finished&&ev.key==="Enter"){
    ev.preventDefault(); const it=sub.items[sub.queue[0]];
    if(sub.res) quizNext(); else if(!it.mc) quizCheck();
  }
});
function mono(t){if(!state.mono[t])state.mono[t]={count:0};return state.mono[t]}
let essayT=null;
function saveEssay(v){
  const x=essay(sub.topic); x.text=v;
  const ch=essayChecks(v), tw=sub.timed?100:TOPICS[sub.topic].words;
  const el=$("#essayChk"); if(el) el.innerHTML=chkHtml(ch,tw);
  if(!sub.timed&&x.metOn!==todayKey()&&essayCheckMet(sub.topic,v)){x.met=true;x.metOn=todayKey();completed("essay:"+sub.topic);const st=$("#essayState");if(st)st.innerHTML=`<div class="fb ok">Aufsatz geschafft. Lass ihn noch korrigieren und lies die Korrektur laut.</div>`}
  if(sub.timed&&!sub.counted&&ch.wc>=100&&Date.now()-sub.start<=26*60*1000){sub.counted=true;state.timedN=(state.timedN||0)+1;completed("essay:timed");const st=$("#essayState");if(st)st.innerHTML=`<div class="fb ok">100 Wörter in der Zeit geschafft.</div>`}
  clearTimeout(essayT);essayT=setTimeout(()=>touch("prog"),800);
}
function essay(t){if(!state.essays[t])state.essays[t]={text:"",feedback:""};return state.essays[t]}
setInterval(()=>{const el=document.getElementById("essayTimer");if(el&&sub&&sub.timed){const r=Math.max(0,25*60-Math.floor((Date.now()-sub.start)/1000));el.textContent=r?Math.floor(r/60)+":"+pad(r%60):"Zeit um";}},1000);

function corrBlock(kind,x){
  const s=sub;
  return `<div class="stack corr" style="gap:8px"><span class="label">Korrektur</span>
  <button class="${x.feedback?"":"primary"}" data-copyfix="${kind}">Für Korrektur kopieren</button>
  ${s.copyFallback?`<p class="small">Kopieren ging nicht automatisch. Text ist markiert, jetzt kopieren:</p><textarea id="copyBox" readonly style="min-height:90px">${esc(s.copyFallback)}</textarea>`:""}
  <p class="small muted">${s.copied?"Kopiert. Öffne Gemini, füge es ein und kopiere die Antwort hierher.":"Kopiert deinen Text mit fertiger Anleitung. Dann in Gemini einfügen."}</p>
  <textarea id="fbIn" style="min-height:${x.feedback?220:90}px" placeholder="Antwort von Gemini hier einfügen">${esc(x.feedback||"")}</textarea>
  ${s.err?`<div class="fb bad">${esc(s.err)}</div>`:""}</div>`;
}
function fbTarget(){const s=sub;if(!s)return null;if(s.kind==="essay")return essay(s.topic);if(s.kind==="mono")return mono(s.topic);if(s.kind==="lesen")return lz(s.id);return null}
function copyText(txt,onOk,onFail){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(onOk).catch(onFail);return}}catch(e){}onFail()}
function askClaude(prompt,target){
  const s=sub; s.err=""; s.copyFallback="";
  copyText(prompt,()=>{s.copied=true;if(sub===s)render()},()=>{s.copyFallback=prompt;s.copied=false;if(sub===s){render();const b=document.getElementById("copyBox");if(b){b.focus();b.select()}}});
}
async function askClaudeOld(prompt,target){
  const s=sub; s.loading=true; s.err=""; s.stream="Claude liest …"; render();
  try{
    const r=await sample(prompt,{onText:({text})=>{s.stream=text;const o=document.querySelector(".out");if(o&&sub===s)o.textContent=text}});
    target.feedback=r.text; s.stream=""; touch("prog");
  }catch(e){
    s.stream="";
    s.err=e&&e.code==="not_granted"?"Die Korrektur wurde nicht erlaubt. Du kannst den Text kopieren und mir im Chat schicken.":e&&e.code==="rate_limited"?"Gerade zu viele Anfragen. Versuch es in ein paar Minuten nochmal.":"Die Korrektur hat nicht geklappt. Versuch es später nochmal.";
  }finally{s.loading=false; if(sub===s) render()}
}
function correctEssay(){
  const t=sub.topic, text=$("#essayText").value.trim(); if(!text){sub.err="Schreib erst etwas.";render();return}
  const x=essay(t); x.text=text;
  askClaude(`Du bist Spanisch-Dozentin an der Hochschule München und korrigierst einen Übungsaufsatz für die Prüfung UNIcert I (B1). Der Student hat reales Niveau A1 bis A2 und will vor allem bestehen. Aufgabe: "${TOPICS[t].task}" Unterthemen: ${TOPICS[t].subs.join(", ")}. Vorgabe: ca. ${TOPICS[t].words} bis 150 Wörter, feste Vorlage mit Konnektoren (Para empezar, En primer lugar respecto a, ya que, Además, puesto que, Por lo tanto, En segundo lugar tocante a, dado que, Asimismo, Por eso, En tercer lugar en cuanto a, Por todo ello, Finalmente, En resumen desde mi punto de vista), Pflicht: mindestens 2x Futuro, 2x Condicional, 2x Subjuntivo.

Antworte auf Deutsch, ohne Einleitung, in genau diesen Abschnitten mit kurzen Zeilen:
EINSCHÄTZUNG: ein Satz, ob das für B1 reichen würde, und die geschätzte Punktzahl von 100.
PFLICHT-CHECK: Futuro, Condicional, Subjuntivo, je Anzahl korrekt verwendet mit einem Beispiel aus dem Text; fehlende Konnektoren.
DIE 5 WICHTIGSTEN FEHLER: jeweils "Original → Korrektur (kurzer Grund)".
EIN SATZ ZUM MERKEN: ein besserer Satz, den er in der Prüfung wiederverwenden kann.
KORRIGIERTE FASSUNG: der ganze Aufsatz korrigiert, so nah wie möglich am Original, auf B1-Niveau.

Aufsatz:
"""${text.slice(0,4000)}"""`,x);
}
function checkMono(){
  const t=sub.topic, text=$("#monoText").value.trim(); if(!text){sub.err="Schreib erst deinen Monolog.";render();return}
  const x=mono(t); x.text=text;
  askClaude(`Du bist Spanisch-Dozentin und bereitest einen Studenten (reales Niveau A1 bis A2) auf die mündliche Prüfung UNIcert I (B1) vor. Thema: "${TOPICS[t].name}". Er lernt diesen Mini-Monolog auswendig (ca. 8 Sätze, 1 Minute). Bauplan: 2 Fakten, persönlicher Bezug, Vor- und Nachteile, Meinung mit "no creo que + Subjuntivo", Zukunft mit Futuro, Wunsch mit Condicional.

Antworte auf Deutsch, ohne Einleitung, kurz:
FEHLER: jeweils "Original → Korrektur (Grund)", höchstens 5.
FEHLT IM BAUPLAN: was fehlt.
KORRIGIERTE FASSUNG: der Monolog korrigiert, einfach und gut sprechbar, höchstens 9 Sätze.

Monolog:
"""${text.slice(0,3000)}"""`,x);
}

loadLocal(); loadDict(); loadCards();
const h=(location.hash||"").slice(1); if(TABS.some(t=>t[0]===h)) view=h;
render();
setSync("","Gespeichert auf diesem Gerät");
initSync(); initExtras();
})();
